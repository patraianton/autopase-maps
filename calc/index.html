<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AutoPase: сколько приносят отчёты</title>
<style>
  :root { --ink:#0f172a; --mut:#64748b; --bg:#f4f1ea; --card:#fff; --line:#ece8df; --good:#15803d; --bad:#dc2626; --a:#2563eb; --b:#0d9488; --c:#ea580c; }
  * { box-sizing:border-box; }
  html, body { overflow-x:hidden; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .wrap { max-width:1180px; margin:0 auto; padding:14px 16px 30px; }

  .top { display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; margin-bottom:10px; }
  h1 { position:relative; font-size:21px; margin:0; letter-spacing:-.3px; display:flex; align-items:center; gap:6px; }
  .scen { position:relative; display:flex; flex-wrap:wrap; gap:6px; align-items:center; margin-left:auto; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; }
  .chip { display:inline-flex; align-items:center; border:1.5px solid var(--ink); background:#fff; border-radius:999px; overflow:hidden; }
  .chip button { border:0; background:none; color:var(--ink); font:600 13px system-ui; padding:4px 10px; cursor:pointer; }
  .chip .x { padding:4px 8px 4px 0; font-size:15px; line-height:1; color:var(--mut); }
  .chip .x:hover { color:var(--bad); }
  .chip.on { background:var(--ink); } .chip.on button { color:#fff; }
  #sname { width:170px; font:500 13px system-ui; padding:5px 9px; border:1.5px solid #d0d5dd; border-radius:8px; background:#fff; color:var(--ink); }
  .act { border:1.5px solid var(--ink); background:var(--ink); color:#fff; border-radius:8px; padding:5px 10px; font:650 13px system-ui; cursor:pointer; }
  .act.ghost { background:#fff; color:var(--ink); }
  .msg { color:var(--good); font-weight:650; font-size:13px; }

  .card { position:relative; background:var(--card); border-radius:12px; padding:10px 14px; box-shadow:0 1px 0 #0000000d,0 6px 18px #0f172a0d; }
  .gen { display:flex; flex-wrap:wrap; gap:8px 26px; align-items:center; margin-bottom:10px; }
  .g { position:relative; display:flex; align-items:center; gap:6px; font-weight:600; }

  .cols { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
  .col { border-top:5px solid var(--vc); }
  .a { --vc:var(--a); } .b { --vc:var(--b); } .c { --vc:var(--c); }
  .hd { position:relative; display:flex; align-items:center; gap:6px; font-weight:750; font-size:15px; }
  .badge { flex:none; width:22px; height:22px; border-radius:6px; background:var(--vc); color:#fff; display:inline-flex; align-items:center; justify-content:center; font-weight:800; font-size:13px; }
  .best-tag { margin-left:auto; background:#fef3c7; color:#92400e; font-size:11.5px; font-weight:750; border-radius:999px; padding:2px 8px; visibility:hidden; }
  .col.best .best-tag { visibility:visible; }
  .big { font-size:28px; font-weight:800; letter-spacing:-.8px; line-height:1.1; margin-top:4px; }
  .big small { font-size:13px; font-weight:600; color:var(--mut); letter-spacing:0; }
  .good { color:var(--good); } .bad { color:var(--bad); }
  .sub { position:relative; display:flex; align-items:center; gap:5px; color:var(--mut); font-size:12.5px; margin-top:1px; }
  .ver { position:relative; display:flex; align-items:center; gap:5px; font-weight:650; font-size:12.5px; margin:3px 0 6px; }

  .row { position:relative; display:flex; align-items:center; gap:5px; padding:5px 0 7px; border-top:1px solid var(--line); }
  .row .arr { color:var(--vc); font-weight:800; width:10px; }
  .row .lbl { flex:1; min-width:0; }
  .row b { font-size:17px; font-weight:800; letter-spacing:-.3px; min-width:44px; text-align:right; }
  .row i { position:absolute; left:0; bottom:0; height:3px; background:var(--vc); border-radius:2px; opacity:.75; transition:width .2s; }
  .row.first .lbl { font-weight:650; }
  .mrow { position:relative; display:flex; align-items:center; gap:5px; padding:5px 0; border-top:1px dashed var(--line); }
  .mrow .lbl { flex:1; min-width:0; }
  .mtitle { font-size:11px; font-weight:750; letter-spacing:.07em; text-transform:uppercase; color:var(--mut); margin:6px 0 1px; }

  input[type=number] { width:58px; font:650 14px system-ui; padding:2px 5px; border:1.5px solid #d0d5dd; border-radius:6px; background:#fff; color:var(--ink); }
  input[type=number]:focus { outline:none; border-color:var(--ink); }
  input.chg { border-color:#f59e0b; background:#fffbeb; }
  .unit { color:var(--mut); font-weight:650; }

  .tip { flex:none; display:inline-flex; align-items:center; justify-content:center; width:16px; height:16px; border-radius:50%; background:#e4e7ec; color:#344054; font:700 11px system-ui; cursor:help; vertical-align:1px; }
  .tip:hover, .tip:focus { background:var(--ink); color:#fff; outline:none; }
  .tip:hover::after, .tip:focus::after { content:attr(data-tip); white-space:pre-line; position:absolute; left:0; right:0; min-width:220px; bottom:calc(100% + 4px); background:var(--ink); color:#fff; font:500 12.5px/1.4 system-ui; padding:8px 10px; border-radius:8px; z-index:50; box-shadow:0 8px 24px #10182833; text-align:left; letter-spacing:0; text-transform:none; }
  .hd .tip:hover::after, .hd .tip:focus::after, h1 .tip:hover::after, h1 .tip:focus::after, .scen .tip:hover::after, .scen .tip:focus::after { bottom:auto; top:calc(100% + 4px); }
  h1 .tip:hover::after, h1 .tip:focus::after { width:360px; right:auto; }
  .scen .tip:hover::after, .scen .tip:focus::after { left:auto; right:0; width:300px; }

  @media (max-width:900px) { .cols { grid-template-columns:minmax(0,1fr); } .scen { margin-left:0; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Сколько приносят отчёты <span class="tip" tabindex="0" role="button" aria-label="Подсказка" data-tip="Три способа зарабатывать на отчётах. Меняйте числа — всё пересчитается сразу. Воронка за один день, деньги за месяц.&#10;Жёлтая рамка — число изменено против наших цифр.&#10;«Факт» в подсказках — неделя 19–25.11.2026 без команды и проверок: база сайта, почтовая служба, счётчик посещений. «Оценка» — предположение.">?</span></h1>
    <div class="scen">
      <div class="chips" id="chips"></div>
      <input id="sname" maxlength="40" placeholder="Название сценария" aria-label="Название сценария" autocomplete="off" data-lpignore="true" data-1p-ignore>
      <button type="button" id="save" class="act">Сохранить</button>
      <button type="button" id="share" class="act ghost">Ссылка</button>
      <span class="tip" tabindex="0" role="button" aria-label="Подсказка" data-tip="Сценарии хранятся в этом браузере. Чтобы показать другому человеку, нажмите «Ссылка» и отправьте её: в ней все числа.">?</span>
      <span id="msg" class="msg"></span>
    </div>
  </div>

  <div class="card gen" id="gen"></div>

  <div class="cols" id="cols"></div>
</div>
<script>
// Каждое число: l — название, d — наше значение, s — шаг, u — единица, n — откуда цифра, t — подсказка
var M = {
  people: { l: 'Посетителей сайта в день', d: 1100, s: 100, u: '', n: 'факт 19–25.11: в среднем 1 100 в день',
    t: 'Сколько разных людей заходит на сайт за день. Расходы растут вместе с этим числом.' },
  cost: { l: 'Расходы в месяц сейчас, при 1 000 посетителях в день', d: 500, s: 50, u: '€', n: 'сейчас 500 €',
    t: 'Всё, что мы тратим на сайт за месяц при нынешних 1 000 посетителях в день.' },
  step: { l: 'Плюс расходов на каждую следующую 1 000 посетителей в день', d: 200, s: 10, u: '€', n: 'ваша оценка: 200 €',
    t: 'На сколько вырастают расходы в месяц, когда посетителей в день становится на 1 000 больше. 2 000 посетителей — 500 + 200 = 700 € в месяц.' },

  email: { l: 'заказывают бесплатный отчёт', d: 2.2, s: 0.1, u: '%', n: 'факт 19–25.11: 172 человека за неделю',
    t: 'Сколько посетителей из 100 оставляют почту и заказывают первый отчёт. Первый отчёт бесплатный.' },
  got: { l: 'получают его', d: 47, s: 1, u: '%', n: 'факт: 80 из 172. Не меньше: часть отправок без отметки',
    t: 'Не по каждой машине мы находим данные. Остальным уходит письмо «не нашли». Чаще всего это заказы по VIN и номеру.' },
  see: { l: 'видят цену второго отчёта', d: 14, s: 1, u: '%', n: 'факт: не меньше 11 человек за неделю. Отметки показа нет',
    t: 'Сколько получивших бесплатный отчёт заказывают второй и видят окно оплаты.' },
  pay: { l: 'платят', d: 18, s: 1, u: '%', n: 'факт: 2 оплаты из 11. Слишком мало, чтобы верить',
    t: 'Сколько из увидевших окно оплаты заплатили.' },
  price: { l: 'Цена нашего платного отчёта', d: 2.9, s: 0.1, u: '€', n: 'сейчас на сайте 2,90 € (проверено в настройках)',
    t: 'Сколько человек платит за второй и следующие отчёты. Вся цена наша. Сейчас на сайте 2,90 €.' },
  cprA: { l: 'Производство одного отчёта', d: 0, s: 0.05, u: '€', n: 'не знаю — впишите своё',
    t: 'Сколько нам стоит сделать один отчёт: ИИ, данные, работа людей. Считается на каждый выданный отчёт: и бесплатный, и платный.' },

  emailB: { l: 'заказывают и получают бесплатный отчёт', d: 2.2, s: 0.1, u: '%', n: 'факт 19–25.11: 2,2 % посетителей',
    t: 'Сколько посетителей из 100 заказывают отчёт. Здесь все наши отчёты бесплатные, и считаем, что получают их все.' },
  open: { l: 'открывают письмо с отчётом', d: 67, s: 1, u: '%', n: 'факт: 67 %. Почтовые программы немного завышают',
    t: 'Сколько получивших открывают письмо «Отчёт готов».' },
  click: { l: 'нажимают «купить глубокий отчёт»', d: 5, s: 1, u: '%', n: 'оценка. Сейчас по любой ссылке в письме нажимают 13 %',
    t: 'В бесплатном отчёте предлагаем купить подробный. Сколько открывших на это нажимают.' },
  buy: { l: 'покупают', d: 6, s: 1, u: '%', n: 'оценка: 5–8 %',
    t: 'Сколько нажавших доходят до оплаты и платят.' },
  priceB: { l: 'Цена нашего глубокого отчёта', d: 7.9, s: 0.1, u: '€', n: 'Женя называл 7,90 €',
    t: 'Глубокий отчёт делаем и продаём сами, вся цена наша.' },
  cprB: { l: 'Производство одного бесплатного отчёта', d: 0, s: 0.05, u: '€', n: 'не знаю — впишите своё',
    t: 'Сколько нам стоит сделать один бесплатный отчёт: ИИ, данные, работа людей. Считается на каждый выданный отчёт.' },
  costDeep: { l: 'Производство одного глубокого отчёта', d: 0, s: 0.1, u: '€', n: 'не знаю — впишите своё',
    t: 'Сколько нам стоит сделать один глубокий отчёт: купить данные, ИИ, работа людей. Вычитается из каждой продажи.' },

  emailC: { l: 'заказывают и получают бесплатный отчёт', d: 2.2, s: 0.1, u: '%', n: 'факт 19–25.11: 2,2 % посетителей',
    t: 'Сколько посетителей из 100 заказывают отчёт. Здесь все наши отчёты бесплатные, и считаем, что получают их все.' },
  openC: { l: 'открывают письмо с отчётом', d: 67, s: 1, u: '%', n: 'факт: 67 %. Почтовые программы немного завышают',
    t: 'Сколько получивших открывают письмо «Отчёт готов».' },
  clickC: { l: 'переходят по ссылке к партнёру', d: 5, s: 1, u: '%', n: 'оценка. Сейчас по любой ссылке в письме нажимают 13 %',
    t: 'В бесплатном отчёте ставим ссылку на отчёт партнёра. Сколько открывших по ней переходят.' },
  buyC: { l: 'покупают у партнёра', d: 6, s: 1, u: '%', n: 'оценка: 5–8 %',
    t: 'Сколько перешедших покупают отчёт на сайте партнёра.' },
  comm: { l: 'Наша комиссия с одной продажи', d: 4, s: 0.1, u: '€', n: 'carVertical платил 4 €. За неделю 18 переходов, выплат в данных не видно',
    t: 'Сколько партнёр платит нам за каждую продажу по нашей ссылке. Его отчёт делает он сам, нам это ничего не стоит.' },
  cprC: { l: 'Производство одного бесплатного отчёта', d: 0, s: 0.05, u: '€', n: 'не знаю — впишите своё',
    t: 'Сколько нам стоит сделать один бесплатный отчёт: ИИ, данные, работа людей. Считается на каждый выданный отчёт.' }
};
var GEN = ['people', 'cost', 'step'];
// c — люди на каждом шаге воронки: c[0] пришли, c[1] после первого процента и т. д.
var V = [
  { id: 'a', L: 'А', name: 'Как сейчас', title: 'Как сейчас: первый отчёт бесплатно, следующие платные',
    tip: 'Человек заказывает первый отчёт бесплатно. Второй и следующие продаём сами, вся цена наша.',
    steps: [['email', 'заказали отчёт'], ['got', 'получили отчёт'], ['see', 'увидели цену второго'], ['pay', 'заплатили']],
    money: ['price', 'cprA'],
    calc: function (c) { return { rev: c[4] * v.price, out: (c[2] + c[4]) * v.cprA }; } },
  { id: 'b', L: 'Б', name: 'Свой глубокий отчёт', title: 'Все отчёты бесплатно, глубокий отчёт продаём сами',
    tip: 'Все наши отчёты отдаём бесплатно. В отчёте предлагаем купить глубокий отчёт, который делаем сами. Деньги от продажи наши, минус стоимость его производства.',
    steps: [['emailB', 'получили бесплатный отчёт'], ['open', 'открыли письмо'], ['click', 'нажали «купить»'], ['buy', 'купили глубокий отчёт']],
    money: ['priceB', 'costDeep', 'cprB'],
    calc: function (c) { return { rev: c[4] * v.priceB, out: c[1] * v.cprB + c[4] * v.costDeep }; } },
  { id: 'c', L: 'В', name: 'Глубокий отчёт партнёра', title: 'Все отчёты бесплатно, глубокий отчёт продаёт партнёр',
    tip: 'Все наши отчёты отдаём бесплатно. В отчёте ставим ссылку на отчёт партнёра, например carVertical. Отчёт продаёт партнёр, нам комиссия с каждой продажи.',
    steps: [['emailC', 'получили бесплатный отчёт'], ['openC', 'открыли письмо'], ['clickC', 'перешли к партнёру'], ['buyC', 'купили у партнёра']],
    money: ['comm', 'cprC'],
    calc: function (c) { return { rev: c[4] * v.comm, out: c[1] * v.cprC }; } }
];
var BASE = 1000; // при таком трафике расходы равны полю «Расходы в месяц сейчас»
var v = {}, def = {};
Object.keys(M).forEach(function (k) { def[k] = M[k].d; v[k] = M[k].d; });

// Числа сценария живут в строке вида «people=3000&cost=500» — и в адресе страницы, и в сохранённых сценариях
function applyHash(str) {
  Object.keys(def).forEach(function (n) { v[n] = def[n]; });
  (str || '').replace(/^#/, '').split('&').forEach(function (p) {
    var kv = p.split('=');
    if (kv[0] in v && kv[1] !== undefined && kv[1] !== '' && !isNaN(+kv[1])) v[kv[0]] = +kv[1];
  });
}
function curHash() {
  return Object.keys(v).filter(function (n) { return v[n] !== def[n]; }).map(function (n) { return n + '=' + v[n]; }).join('&');
}
function fullHash() { return Object.keys(v).map(function (n) { return n + '=' + v[n]; }).join('&'); }
applyHash(location.hash);

function fmt(x, d) {
  return x.toLocaleString('ru-RU', { maximumFractionDigits: d === undefined ? (x < 1 ? 2 : x < 10 ? 1 : 0) : d, minimumFractionDigits: 0 });
}
function eur(x) { return fmt(Math.round(x), 0) + ' €'; }
function signed(x) { return (x >= 0 ? '+' : '−') + eur(Math.abs(x)); }
function tip(t) { return '<span class="tip" tabindex="0" role="button" aria-label="Подсказка" data-tip="' + t + '">?</span>'; }
function inp(k) {
  var m = M[k];
  return '<span class="inrow"><input type="number" id="in_' + k + '" min="0"' + (m.u === '%' ? ' max="100"' : '') + ' step="' + m.s + '" aria-label="' + m.l +
    '" autocomplete="off" data-lpignore="true" data-1p-ignore>' + (m.u ? '<span class="unit">' + m.u + '</span>' : '') + '</span>';
}
function el(id) { return document.getElementById(id); }

var SHORT = { people: 'Посетителей в день', cost: 'Расходы в месяц при 1 000 в день', step: '+ на каждую следующую 1 000',
  price: 'Цена отчёта', cprA: 'Производство отчёта', priceB: 'Цена глубокого отчёта', costDeep: 'Производство глубокого',
  cprB: 'Производство бесплатного', comm: 'Комиссия с продажи', cprC: 'Производство бесплатного' };
function tipOf(k) { var n = M[k].n; return M[k].t + '&#10;' + n.charAt(0).toUpperCase() + n.slice(1) + '.'; }

function build() {
  el('gen').innerHTML = GEN.map(function (k) {
    return '<div class="g"><label for="in_' + k + '">' + SHORT[k] + '</label>' + inp(k) + tip(tipOf(k)) + '</div>';
  }).join('');
  el('cols').innerHTML = V.map(function (x) {
    var rows = '<div class="row first"><span class="lbl">пришли на сайт</span><b id="n_' + x.id + '_0"></b><i id="t_' + x.id + '_0"></i></div>';
    x.steps.forEach(function (s, i) {
      rows += '<div class="row"><span class="arr">↓</span>' + inp(s[0]) + '<span class="lbl">' + M[s[0]].l + ' ' + tip(tipOf(s[0])) + '</span>' +
        '<b id="n_' + x.id + '_' + (i + 1) + '" title="' + s[1] + '"></b><i id="t_' + x.id + '_' + (i + 1) + '"></i></div>';
    });
    var money = x.money.map(function (k) {
      return '<div class="mrow"><span class="lbl">' + SHORT[k] + ' ' + tip(tipOf(k)) + '</span>' + inp(k) + '</div>';
    }).join('');
    return '<div class="card col ' + x.id + '" id="sc_' + x.id + '">' +
      '<div class="hd"><span class="badge">' + x.L + '</span>' + x.name + tip(x.title + '.&#10;' + x.tip) + '<span class="best-tag">★ лучший из трёх</span></div>' +
      '<div class="big" id="big_' + x.id + '"></div><div class="sub" id="sub_' + x.id + '"></div><div class="ver" id="ver_' + x.id + '"></div>' +
      rows + '<div class="mtitle">Деньги</div>' + money + '</div>';
  }).join('');
  Object.keys(M).forEach(function (k) {
    el('in_' + k).addEventListener('input', function (e) {
      var x = parseFloat(String(e.target.value).replace(',', '.'));
      v[k] = isNaN(x) ? 0 : Math.max(0, x);
      update(true);
    });
  });
  initScenarios();
}

function verdict(x, r) {
  // m — что каждая 1 000 посетителей в день оставляет нам за месяц, после производства отчётов
  var m = v.people ? (r.rev - r.out) * 30 * BASE / v.people : 0, fixed = v.cost - v.step;
  var base = 'Каждая 1 000 посетителей приносит ' + eur(m) + ' в месяц, а добавляет ' + eur(v.step) + ' расходов.';
  if (r.profit >= 0) return { s: '✅ в плюсе', l: base };
  if (m > v.step) {
    var need = Math.ceil(BASE * fixed / (m - v.step));
    return { s: '➡️ в ноль при ' + fmt(need, 0) + ' посетителях в день', l: base + ' Выйдем в ноль при ' + fmt(need, 0) + ' посетителях в день (сейчас ' + fmt(v.people, 0) + ').' };
  }
  return { s: '❌ не окупается при любом трафике', l: base + ' Больше людей не спасёт.' + (m > 0 ? ' Нужно, чтобы каждый посетитель приносил в ' + fmt(v.step / m, 1) + ' раза больше.' : '') };
}

function update(fromInput) {
  Object.keys(M).forEach(function (k) {
    var e = el('in_' + k);
    if (!fromInput || document.activeElement !== e) e.value = v[k];
    e.classList.toggle('chg', v[k] !== def[k]);
  });
  var costsMonth = Math.max(0, v.cost + v.step * (v.people - BASE) / BASE);
  var top = Math.log10(1 + v.people * 9) || 1, res = [];
  V.forEach(function (x) {
    var c = [v.people];
    x.steps.forEach(function (s) { c.push(c[c.length - 1] * v[s[0]] / 100); });
    c.forEach(function (n, i) {
      el('n_' + x.id + '_' + i).textContent = fmt(n);
      el('t_' + x.id + '_' + i).style.width = Math.max(1.5, Math.min(100, 100 * Math.log10(1 + n * 9) / top)).toFixed(1) + '%';
    });
    var r = x.calc(c);
    r.profit = r.rev * 30 - costsMonth - r.out * 30;
    var w = verdict(x, r), cls = r.profit >= 0 ? 'good' : 'bad';
    res.push(r.profit);
    el('big_' + x.id).className = 'big ' + cls;
    el('big_' + x.id).innerHTML = signed(r.profit) + ' <small>в месяц</small>';
    el('sub_' + x.id).innerHTML = 'выручка ' + eur(r.rev * 30) + ' · расходы ' + eur(costsMonth + r.out * 30) + ' ' +
      tip('Выручка ' + eur(r.rev * 30) + '&#10;− расходы на сайт ' + eur(costsMonth) + '&#10;− производство отчётов ' + eur(r.out * 30) + '&#10;= прибыль ' + signed(r.profit));
    el('ver_' + x.id).innerHTML = w.s + ' ' + tip(w.l);
  });
  var best = res.indexOf(Math.max.apply(null, res));
  V.forEach(function (x, i) { el('sc_' + x.id).classList.toggle('best', i === best && res.some(function (p) { return p !== res[best]; })); });
  var hash = curHash();
  history.replaceState(null, '', hash ? '#' + hash : location.pathname);
  drawChips();
}

// Сохранённые сценарии — в памяти этого браузера
var KEY = 'autopase-calc-scenarios';
function loadSc() { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) { return []; } }
function saveSc(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
function say(t) {
  var m = el('msg');
  m.textContent = t;
  clearTimeout(say.t);
  say.t = setTimeout(function () { m.textContent = ''; }, 2500);
}
function drawChips() {
  var box = el('chips'), h = curHash();
  box.innerHTML = '';
  var all = [{ name: 'Наши цифры', vals: '', fixed: true }].concat(loadSc());
  all.forEach(function (s, i) {
    var chip = document.createElement('span');
    chip.className = 'chip' + ((s.full ? s.full === fullHash() : s.vals === h) ? ' on' : '');
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = s.name;
    b.title = 'Открыть сценарий';
    b.addEventListener('click', function () { applyHash(s.full || s.vals); update(); });
    chip.appendChild(b);
    if (!s.fixed) {
      var x = document.createElement('button');
      x.type = 'button';
      x.className = 'x';
      x.textContent = '×';
      x.title = 'Удалить сценарий';
      x.setAttribute('aria-label', 'Удалить сценарий ' + s.name);
      x.addEventListener('click', function () {
        var list = loadSc();
        list.splice(i - 1, 1);
        saveSc(list);
        drawChips();
        say('Удалён: ' + s.name);
      });
      chip.appendChild(x);
    }
    box.appendChild(chip);
  });
}
function initScenarios() {
  var box = el('sname');
  function save() {
    var list = loadSc();
    var name = box.value.trim() || ('Сценарий ' + (list.length + 1));
    var full = fullHash();   // все числа целиком: сценарий не поменяется, когда поменяются наши цифры
    var at = list.findIndex(function (s) { return s.name === name; });
    if (at >= 0) { list[at].full = full; delete list[at].vals; } else list.push({ name: name, full: full });
    saveSc(list);
    box.value = '';
    drawChips();
    say('Сохранён: ' + name);
  }
  el('save').addEventListener('click', save);
  box.addEventListener('keydown', function (e) { if (e.key === 'Enter') save(); });
  el('share').addEventListener('click', function () {
    var url = location.href.split('#')[0] + '#' + fullHash();
    if (navigator.clipboard) {
      navigator.clipboard.writeText(url).then(function () { say('Ссылка скопирована — в ней все числа'); }, function () { say(url); });
    } else say(url);
  });
}
build();
update();
</script>
