<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Карточка отчёта на странице машины</title>
<style>
body{margin:0;background:#e5e9f0;font-family:Inter,Arial,sans-serif;color:#0f172b}
.bar{padding:14px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:center;font-size:15px}
.bar a{color:#2563eb;text-decoration:none;font-weight:700}
.bar button{font:inherit;font-weight:700;padding:8px 16px;border-radius:999px;border:1.5px solid #cbd5e1;background:#fff;cursor:pointer}
.bar button.on{background:#2563eb;border-color:#2563eb;color:#fff}
.stage{display:flex;justify-content:center;padding:0 12px 30px}
iframe{border:0;background:#fff;display:block;box-shadow:0 10px 30px rgba(15,23,43,.2)}
iframe.d{width:100%;max-width:1280px;height:calc(100vh - 80px);min-height:620px}
iframe.m{width:390px;height:844px;max-height:calc(100vh - 80px);border-radius:26px}
</style></head><body>
<div class="bar"><a href="index.html">&larr; все макеты</a><button id="bd" class="on">Компьютер</button><button id="bm">Телефон 390</button></div>
<div class="stage"><iframe id="f" class="d" src="car-card-d-frame.html" title="карточка"></iframe></div>
<script>
var f=document.getElementById('f'),bd=document.getElementById('bd'),bm=document.getElementById('bm');
function set(m){f.className=m;f.src=m==='d'?'car-card-d-frame.html':'car-card-m-frame.html';bd.className=m==='d'?'on':'';bm.className=m==='m'?'on':''}
bd.onclick=function(){set('d')};bm.onclick=function(){set('m')};
if(window.innerWidth<=520){location.replace('car-card-m-frame.html')}
</script></body></html>
